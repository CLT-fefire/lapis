[package]
name = "lapis"
version = "0.3.0"
description = "Personal Markdown Knowledge Workbench"
authors = ["정철화 <fefire@dearu.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lapis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
trash = "5"
rusqlite = { version = "0.39.0", features = ["bundled"] }
# Phase Search — tantivy(Rust 네이티브 Lucene-like) + lindera(한국어 형태소 토크나이저)
# tantivy 0.25 + lindera 2.x: lindera-tantivy 2.0.0의 의존 버전과 일치 (0.26은 Tokenizer trait incompat)
# embed-ko-dic: 한국어 사전을 binary에 임베디드 (외부 다운로드 불필요, dmg +~20MB)
tantivy = "0.25"
lindera = "2"
lindera-tantivy = { version = "2", features = ["embed-ko-dic"] }

