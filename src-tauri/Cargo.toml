[package]
name = "lapis"
version = "1.13.0"
description = "Personal Markdown Knowledge Workbench"
authors = ["eren0315"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lapis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
trash = "5"
# 병렬 iterator — vault read_vault_bundle에서 read_to_string 동시 다발 실행.
# work-stealing scheduler라 thread pool 관리 신경 안 써도 됨. 바이너리 +~50KB.
rayon = "1"
# gzip — search-cache JSON(30MB → ~5MB) 압축. IPC + disk read 큰 폭 단축.
flate2 = "1"
tauri-plugin-window-state = "2.4.1"

# release dmg 최적화 — 빌드 시간 증가 vs 런타임/바이너리 크기 트레이드오프.
# - lto = "thin": 모듈 간 inline + dead code 제거. "fat"보다 빌드 시간 절약.
# - codegen-units = 1: 단일 unit으로 LTO 효과 극대화.
# - strip = true: 디버그 심볼 제거 → dmg 크기 감소.
# - panic = "abort": panic 시 unwind 코드 제거 → 바이너리 더 작음. Lapis는 사용자
#   panic 분석 빈도 낮아 OK (필요 시 panic hook으로 stderr 박제).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

