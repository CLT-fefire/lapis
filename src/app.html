<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lapis</title>
    <script>
      // FOUC 방지 — first-paint 전에 테마 속성 적용 (theme.ts와 키 동기화)
      (function () {
        try {
          var t = localStorage.getItem("lapis.theme");
          document.documentElement.dataset.theme =
            t === "light" || t === "dark" || t === "system" ? t : "system";
        } catch (e) {
          document.documentElement.dataset.theme = "system";
        }
      })();
      // 레이아웃 점프 방지 — first-paint 전에 밀도 속성 적용 (density.ts와 키 동기화)
      (function () {
        try {
          var d = localStorage.getItem("lapis.density");
          document.documentElement.dataset.density = d === "compact" ? "compact" : "default";
        } catch (e) {
          document.documentElement.dataset.density = "default";
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
