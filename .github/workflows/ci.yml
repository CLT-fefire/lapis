# 커밋·PR에서 로컬 검증과 같은 것을 돌린다.
#
# 로컬 명령과 1:1로 맞춰 두었다 — CI가 잡는 것과 손으로 잡는 것이 갈리면
# 어느 쪽도 믿을 수 없게 된다.
#
#   npm run check      svelte-check (paraglide 컴파일 선행)
#   npm run check:mcp  MCP 서버 tsc
#   npm test           vitest (src/ + mcp/)
#   npm run build      vite 빌드
#   cargo fmt --check  Rust 포맷
#   cargo clippy       Rust 린트 (경고를 오류로)
#   cargo check        Rust 타입 체크
#   cargo test         Rust 단위 테스트
#
# fmt·clippy는 2026-08-19에 게이트로 승격했다. 그전엔 코드가 둘 다 통과하지 못해
# 일부러 빼뒀다 — 처음부터 빨간 CI는 아무도 안 본다. 먼저 고치고 나서 걸었다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 push하면 앞선 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — check · test · build
    # 프런트엔드는 플랫폼 의존이 없다(vitest environment=node, 경로 assertion은 문자열뿐).
    # macOS 러너는 Rust 잡에서만 쓴다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: svelte-check
        run: npm run check

      - name: MCP 서버 타입 체크
        run: npm run check:mcp

      - name: 단위 테스트
        run: npm test

      - name: 프런트엔드 빌드
        run: npm run build

  rust:
    name: Rust — fmt · clippy · check · test (macOS)
    # Tauri 앱은 macOS 전용이다. Linux에서 cargo check를 돌리면 webkit2gtk 계열
    # 의존을 요구해 실제 타깃과 다른 것을 검증하게 된다.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri-build가 tauri.conf.json의 frontendDist(`../build`)를 실제로 찾는다.
      # 없으면 build.rs 단계에서 실패하므로 cargo보다 먼저 만들어 둔다.
      - name: 프런트엔드 산출물 준비 (tauri-build 요구사항)
        run: npm run build

      # 포맷·린트를 먼저 — 컴파일보다 싸고, 실패 원인이 한눈에 보인다.
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
